<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/b4023152be.js"
      crossorigin="anonymous"
    ></script>
    <title>Bibliotèque</title>
  </head>
  <body>
    <header>
      <h1 align="center">Bibliotèque</h1>
    </header>

    <main>
      <table width="100%">
        <tr align="center">
          <td width="33%">
            <figure>
              <a href="catastrophique.html"
                ><img
                  src="images/la_tres_catastrophique_visite_du_zoo.jpeg"
                  alt=""
                  width="200"
              /></a>
              <figcaption>La Très Catastrophique Visite du zoo</figcaption>
            </figure>
          </td>
          <td width="33%">
            <figure>
              <a href="menage.html"
                ><img src="images/la_femme_de_menage.jpeg" alt="" width="200"
              /></a>
              <figcaption>La femme de ménage</figcaption>
            </figure>
          </td>
          <td width="33%">
            <figure>
              <a href="guerre.html"
                ><img
                  src="images/femmes_de_guerre_tome_1_la_sage_femme_dauschwitz.jpeg"
                  alt=""
                  width="200"
              /></a>
              <figcaption>
                Femmes de guerre, Tome 1 : La Sage-femme d'auschwitz
              </figcaption>
            </figure>
          </td>
        </tr>
        <tr align="center">
          <td>
            <figure>
              <a href="homme.html"
                ><img
                  src="images/lhomme_des_mille_detours.jpeg"
                  alt=""
                  width="200"
              /></a>
              <figcaption>L'homme des mille détours</figcaption>
            </figure>
          </td>
          <td>
            <figure>
              <a href="resister.html"
                ><img src="images/resister.jpeg" alt="" width="200"
              /></a>
              <figcaption>Résister</figcaption>
            </figure>
          </td>
          <td>
            <figure>
              <a href="noir.html"
                ><img src="images/plus_noir_que_noir.jpeg" alt="" width="200"
              /></a>
              <figcaption>Plus noir que noir</figcaption>
            </figure>
          </td>
        </tr>
      </table>
    </main>

    <footer>
      <table width="100%">
        <tr>
            <td width="20%"></td>
          <td align="center" width="20%">
            <h4>Suivez-nous !</h4>
            <h1>
              <a href="#"><i class="fab fa-twitter"></i></a><br><br>
              <a href="#"><i class="fab fa-instagram"></i></a><br><br>
              <a href="#"><i class="fab fa-youtube"></i></a><br><br>
              <a href="#"><i class="fab fa-snapchat"></i></a><br><br>
            </h1>
          </td>
          <td width="30%">
            <fieldset>
                <legend align="center"><h4>Contact</h4></legend>
                <label for="nom">Prénom NOM : <br>
                    <input type="text" size="40" placeholder="Tappez votre prénom et nom de famille">
                </label><br> <br>
                <label for="email">Email : <br>
                    <input type="email" name="email" id="email" size="40" placeholder="Tappez votre adresse mail">
                </label><br><br>
                <label for="message">Message : <br>
                    <textarea name="message" id="message" cols="32" rows="10" placeholder="Écrivez-nous un message"></textarea>
                </label> <br><br>
                <button>Envoyer</button>
            </fieldset>
          </td>
          <td width="20%"></td>
        </tr>
      </table>
    </footer>
  </body>
</html>
